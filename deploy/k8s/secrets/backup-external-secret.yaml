---
# Backup credentials for the CloudNativePG cluster (ADR 0008), via the
# tofu -> SSM -> ESO -> Secret chain (ADR 0013): infra/opentofu writes three
# SSM SecureStrings under /homelab/cnpg-backup-*; ESO syncs them into Secret
# cvgen-db-backup, which the CNPG operator reads for barmanObjectStore S3
# credentials.
#
# target.template composes the final keys (Replace policy — the default — so
# only these three keys land in the Secret, never the raw remoteRef values):
#   - ACCESS_KEY_ID / SECRET_ACCESS_KEY pass through unchanged and are wired
#     into spec.backup.barmanObjectStore.s3Credentials by deploy/k8s/db.
#   - CVGEN_BACKUP_DESTINATION is composed as s3://<bucket>/cvgen from the
#     bucket-name parameter; the bucket name itself never appears in this
#     repo. The db-side Flux Kustomization substitutes it into the Cluster's
#     destinationPath via postBuild.substituteFrom before apply.
#
# The cnpg.io/reload label lives INSIDE template.metadata.labels on purpose:
# defining a template suppresses ExternalSecret label copying, so a label on
# the ExternalSecret metadata would never reach the generated Secret — and
# CNPG watches that label to hot-reload rotated credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cvgen-db-backup
  namespace: cvgen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: cvgen-db-backup
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: ""
      data:
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        CVGEN_BACKUP_DESTINATION: "s3://{{ .bucket_name }}/cvgen"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: /homelab/cnpg-backup-access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: /homelab/cnpg-backup-secret-access-key
    - secretKey: bucket_name
      remoteRef:
        key: /homelab/cnpg-backup-bucket-name
