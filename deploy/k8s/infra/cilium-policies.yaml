---
# =============================================================================
# cvgen zero-trust L4 segmentation — CiliumNetworkPolicy set (W10 re-land)
# =============================================================================
# Re-land of the reverted vanilla-NetworkPolicy workstream as CNPs, after
# incident 0011 (docs/incidents/0011-netpol-default-deny-behind-cilium-
# gateway.md) proved two things:
#
#   1. Default-deny is a BIDIRECTIONAL contract: every client-side egress
#      allow needs its server-side ingress twin, and infrastructure pods
#      are clients too — CNPG's WAL-archiving egress froze backups silently
#      last time it was left out.
#   2. The enforcement point changes semantics: traffic entering through
#      the Cilium Gateway API listener is judged inside envoy as an RBAC
#      filter, where a blanket deny shadows narrower allows. The listener
#      path is therefore allowed with fromEntities:[host] — the envoy that
#      terminates cv.corruptmane.xyz runs on the HOST network, so gateway
#      pods see connections from the node, not from pod IPs.
#
# Model: default-deny both directions (cvgen-default-deny), then explicit
# allows. Cilium policies are additive across documents, so file order
# carries no enforcement semantics; the set reads top-down anyway: deny,
# shared DNS, ingress allows, per-workload egress, server-side ingress.
#
# ROLLOUT: the cluster currently runs policy-audit-mode=true (fleet-side),
# so these policies LOG would-be drops without enforcing. This is Stage 1
# of .omo/plans/cilium-networkpolicy-zero-trust.md; Stage 2 removes the
# flag after a clean `hubble observe --verdict AUDIT` cycle.
#
# LABEL CONTRACT (verified live against the cluster; full table in
# docs/k8s/network-policy.md):
#   - Flagger relabels the promoted primary's pods to app=gateway-primary.
#     EVERY selector meaning "the serving gateway" lists BOTH app values —
#     selecting only app=gateway would strand the replica actually serving.
#   - NATS (official Helm chart) pods: app.kubernetes.io/name=nats.
#   - CNPG stamps cnpg.io/cluster=cvgen-db on every instance pod; role
#     labels have changed scheme before, so they are never selected on.
#   - Migration Job pods get batch.kubernetes.io/job-name=cvgen-migrate
#     from the Job controller — no pod-template labels required.
#   - Cross-namespace selectors use the k8s:<label> source prefix Cilium
#     puts on Kubernetes-derived labels; namespaces pinned via the
#     immutable io.kubernetes.pod.namespace label.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. DEFAULT DENY — empty rule lists select-nothing-allow-nothing: every pod
#    in cvgen denies all ingress and all egress except what later documents
#    allow. enableDefaultDeny is spelled out so no reader has to know that
#    "ingress: []" IS the default-deny form. A flow not covered below dies
#    here (audit-logged until Stage 2 flips enforcement on).
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-default-deny
  namespace: cvgen
spec:
  description: default-deny all ingress and egress for every cvgen pod
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress: []
  egress: []

---
# 2. DNS — every cvgen pod may resolve via kube-dns (CoreDNS in kube-system).
#    Both UDP and TCP: UDP for lookups, TCP for truncated responses and zone
#    transfers — omitting the TCP leg makes resolvers hang to timeout on the
#    occasional truncated reply. Cross-namespace target, hence the k8s:
#    source prefixes. Per-workload egress policies below repeat this stanza
#    deliberately: CNP allows are additive, so the duplication costs nothing
#    and keeps each workload's contract self-contained if this document's
#    selector is ever narrowed.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-dns-egress
  namespace: cvgen
spec:
  description: allow DNS resolution via kube-dns for all cvgen pods
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# 3. PUBLIC ENTRY — host-network envoy terminates the Gateway API listener,
#    so requests reach gateway pods from the HOST entity, not from pod IPs.
#    This is the exact path incident 0011 got wrong: vanilla NP could not
#    name the host-envoy source, and its port-scoped no-from allow was
#    shadowed by deny-all at envoy's RBAC point. Flagger loadtester traffic
#    rides the same cilium-gateway VIP during canaries, so one rule covers
#    the whole public path. Port-scoped to 8080 so the blast radius stays
#    exactly the public listener.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-gateway-ingress
  namespace: cvgen
spec:
  description: public HTTP entry via host-network envoy into gateway pods
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - gateway-primary # Flagger relabels the promoted primary
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# 4. OPS INGRESS — health/readyz inspection of the three services from the
#    monitoring namespace on their ops port. Namespace-scoped (no pod
#    selector) on purpose: a chart relabel on the scraper side must degrade
#    to "slightly too broad", never to a dead rule. NOT metrics ingestion —
#    telemetry rides OTLP push (egress side, see per-workload policies);
#    the estate's only scrape is flagger itself, outside cvgen.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-ops-ingress
  namespace: cvgen
spec:
  description: ops-port inspection from the monitoring namespace only
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - gateway-primary
          - ai-processor
          - cv-generator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

---
# 5. GATEWAY EGRESS — client matrix for whichever gateway replica serves
#    (canary AND primary): Postgres job history, Valkey API-key/session
#    writes, NATS pub/sub, OTLP push, DNS, and world HTTPS for S3 GetObject
#    PDF downloads (ADR 0012 topology). world:443 is port-scoped, not
#    FQDN-scoped — FQDN rules need the fleet's DNS proxy and are parked as
#    Stage 3 in the plan.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-gateway-egress
  namespace: cvgen
spec:
  description: gateway canary+primary clients (db, cache, nats, otlp, dns, s3)
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - gateway-primary
  egress:
    # Postgres: durable job history. Server side of this contract lives in
    # cvgen-allow-postgres-ingress (incident 0011 lesson one).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: cvgen-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Valkey: SET EX api-key provisioning + sessions (ADR 0006).
    - toEndpoints:
        - matchLabels:
            app: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # NATS: publishes requested/rendered, consumes every event subject.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # OTLP push (ADR 0010): spans/metrics/logs to the fleet collector.
    # Namespace-scoped so a collector chart relabel degrades to broad,
    # never to silent telemetry loss — Flagger's canary gates read these
    # series back from VictoriaMetrics, so a dead rule stalls rollouts.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    # DNS (see policy 2) + world HTTPS for S3 GetObject of rendered PDFs.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# 6. AI-PROCESSOR EGRESS — consumes jobs off NATS, GETDELs the api key from
#    Valkey (exactly-once handoff, ADR 0006), calls user-chosen LLM provider
#    APIs over world HTTPS (provider set varies per request, so port-scoped
#    only), pushes OTLP, resolves DNS.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-ai-processor-egress
  namespace: cvgen
spec:
  description: ai-processor clients (nats, valkey, otlp, dns, llm apis)
  endpointSelector:
    matchLabels:
      app: ai-processor
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # LLM provider APIs — BYO keys, provider varies per request (README).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# 7. CV-GENERATOR EGRESS — consumes structured events off NATS, uploads
#    rendered PDFs to S3 (PutObject over world HTTPS), pushes OTLP,
#    resolves DNS. No Valkey, no Postgres: it holds no session state and
#    writes no history.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-cv-generator-egress
  namespace: cvgen
spec:
  description: cv-generator clients (nats, otlp, dns, s3 upload)
  endpointSelector:
    matchLabels:
      app: cv-generator
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# 8. MIGRATIONS EGRESS — goose SQL migrations against Postgres plus DNS.
#    Incident 0011 opened with this exact Job hanging on a silent TCP
#    connect because its server-side counterpart was missing; both halves
#    now exist (server side: cvgen-allow-postgres-ingress). Job pods carry
#    no authored labels — the controller-stamped job-name label is the
#    stable selector.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-migrations-egress
  namespace: cvgen
spec:
  description: migration Job pods reach postgres and DNS only
  endpointSelector:
    matchLabels:
      batch.kubernetes.io/job-name: cvgen-migrate
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: cvgen-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# 9. SYNTHETIC PROBE EGRESS — the blackbox CronJob probes
#    https://cv.corruptmane.xyz from inside the namespace: DNS + world
#    HTTPS only. Probe traffic re-enters through the public listener, i.e.
#    through policy 3's host-entity rule — no pod-to-pod shortcut exists
#    and none should.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-synthetic-egress
  namespace: cvgen
spec:
  description: synthetic probe reaches DNS and the public HTTPS target only
  endpointSelector:
    matchLabels:
      app: cvgen-synthetic
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# 10. CNPG EGRESS — the database is a CLIENT too: barman WAL archiving and
#     ScheduledBackup push to S3 over world HTTPS, plus DNS. Incident 0011's
#     nastiest finding was this egress silently freezing (archived_count
#     stuck) while everything else looked alive — PITR coverage died with
#     nobody watching the network. Never ship a default-deny without it.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-cnpg-egress
  namespace: cvgen
spec:
  description: CNPG instance pods reach DNS and world for WAL/backup archive
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cvgen-db
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# 11. VALKEY INGRESS — server side of the cache contract: the app services
#     that hold egress allows (gateway pair, ai-processor) may connect.
#     cv-generator appears in the source list for symmetry with the task
#     matrix but holds NO valkey egress allow, so additive evaluation still
#     denies it end-to-end — defense in depth, not an opening.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-valkey-ingress
  namespace: cvgen
spec:
  description: valkey accepts connections from the app services only
  endpointSelector:
    matchLabels:
      app: valkey
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - gateway
                - gateway-primary
                - ai-processor
                - cv-generator
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

---
# 12. NATS INGRESS — server side of the event bus contract: same client set
#     as valkey. Every pub/sub flow in the architecture (requested,
#     structured, rendered) crosses BOTH this rule and a client egress rule;
#     either half missing = silent stall, which is why the pair is reviewed
#     together (incident 0011 lesson one, encoded).
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-nats-ingress
  namespace: cvgen
spec:
  description: nats accepts client connections from the app services only
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - gateway
                - gateway-primary
                - ai-processor
                - cv-generator
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP

---
# 13. POSTGRES INGRESS — server side of the database contract: the serving
#     gateway pair (canary AND promoted primary — see label contract) and
#     the migration Job. Deliberate deviation from the original W10 matrix,
#     which listed only app=gateway: Flagger relabels the primary to
#     app=gateway-primary, so the literal selector would have cut off the
#     ONE replica taking production traffic the moment Stage 2 enforced.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-postgres-ingress
  namespace: cvgen
spec:
  description: postgres accepts gateway replicas and migration Jobs only
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cvgen-db
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - gateway
                - gateway-primary
        - matchLabels:
            batch.kubernetes.io/job-name: cvgen-migrate
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

---
# 14. LOADTESTER INGRESS — Flagger drives load tests during canary analysis
#     from flagger-system; the loadtester Deployment (flagger-loadtester.yaml)
#     carries the chart label app.kubernetes.io/name=loadtester. Source
#     pinned to the flagger pods themselves, not the whole namespace.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-loadtester-ingress
  namespace: cvgen
spec:
  description: loadtester accepts webhook calls from flagger only
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loadtester
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flagger-system
            k8s:app.kubernetes.io/name: flagger
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# 15. LOADTESTER EGRESS — the load tester targets the cilium-gateway VIP,
#     which is served by the HOST-network envoy, so its destination is the
#     host entity on the VIP service port 80 (not a pod IP — selecting the
#     gateway pods directly would miss the listener path entirely). Plus
#     DNS to resolve the target hostname.
# -----------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-loadtester-egress
  namespace: cvgen
spec:
  description: loadtester reaches the host-network gateway VIP and DNS only
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loadtester
  egress:
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
