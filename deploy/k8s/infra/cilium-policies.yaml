# cvgen L4 segmentation via CiliumNetworkPolicy.
#
# Model: explicit per-workload allows only — no namespace-wide catch-all,
# both attempts at one backfired (docs/incidents/0016). Selectors and the
# Gateway-listener rule are explained in docs/k8s/network-policy.md;
# incident reports carry the deep rationale and are referenced inline.
#
# Cross-namespace selectors use Cilium's k8s:<label> source prefix.

---
# 1. Public entry: any source may reach the gateway pair on its app port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-gateway-ingress
  namespace: cvgen
spec:
  description: public HTTP entry into gateway pods
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - gateway-primary # Flagger relabels the promoted primary
  ingress:
    - toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# 2. Ops-port inspection from the monitoring namespace only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-ops-ingress
  namespace: cvgen
spec:
  description: ops-port inspection from the monitoring namespace only
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - gateway-primary
          - ai-processor
          - cv-generator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

---
# 3. Gateway clients: postgres, valkey, nats, OTLP push, DNS, S3 downloads.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-gateway-egress
  namespace: cvgen
spec:
  description: gateway canary+primary clients (db, cache, nats, otlp, dns, s3)
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - gateway-primary
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: cvgen-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # Namespace-scoped so a collector chart relabel degrades to broad, never dead.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# 4. ai-processor clients: nats, valkey, OTLP, DNS, LLM provider APIs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-ai-processor-egress
  namespace: cvgen
spec:
  description: ai-processor clients (nats, valkey, otlp, dns, llm apis)
  endpointSelector:
    matchLabels:
      app: ai-processor
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # BYO keys — provider varies per request, so port-scoped world HTTPS.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# 5. cv-generator clients: nats, OTLP, DNS, S3 upload. No valkey, no postgres.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-cv-generator-egress
  namespace: cvgen
spec:
  description: cv-generator clients (nats, otlp, dns, s3 upload)
  endpointSelector:
    matchLabels:
      app: cv-generator
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# 6. Migration Job clients: postgres plus DNS. Selector is controller-stamped.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-migrations-egress
  namespace: cvgen
spec:
  description: migration Job pods reach postgres and DNS only
  endpointSelector:
    matchLabels:
      batch.kubernetes.io/job-name: cvgen-migrate
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: cvgen-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# 7. Synthetic probe: gateway pods :8080 must be listed explicitly — behind
#    the Gateway listener the client is authorized against the real backend,
#    not the VIP (docs/incidents/0016).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-synthetic-egress
  namespace: cvgen
spec:
  description: synthetic probe reaches DNS, world HTTPS, and the gateway pods
  endpointSelector:
    matchLabels:
      app: cvgen-synthetic
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app: gateway
        - matchLabels:
            k8s:app: gateway-primary
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# 8. CNPG instances are control-plane clients too: WAL archive over world
#    HTTPS, API server for the readiness probe (docs/incidents/0017).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-cnpg-egress
  namespace: cvgen
spec:
  description: CNPG instances reach DNS, world for WAL/backup archive, and the API server
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cvgen-db
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# 9. Valkey accepts the app services only. cv-generator appears here but
#    holds no valkey egress allow, so additive evaluation still denies it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-valkey-ingress
  namespace: cvgen
spec:
  description: valkey accepts connections from the app services only
  endpointSelector:
    matchLabels:
      app: valkey
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - gateway
                - gateway-primary
                - ai-processor
                - cv-generator
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

---
# 10. NATS accepts the app services only; every flow needs this AND a client
#     egress rule (docs/incidents/0011).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-nats-ingress
  namespace: cvgen
spec:
  description: nats accepts client connections from the app services only
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - gateway
                - gateway-primary
                - ai-processor
                - cv-generator
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP

---
# 11. Postgres accepts app clients on 5432 and the CNPG operator on its
#     instance status port (docs/incidents/0017).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-postgres-ingress
  namespace: cvgen
spec:
  description: postgres accepts gateway replicas, migration Jobs, and the CNPG operator
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cvgen-db
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - gateway
                - gateway-primary
        - matchLabels:
            batch.kubernetes.io/job-name: cvgen-migrate
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

---
# 12. Loadtester accepts Flagger webhook calls only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-allow-loadtester-ingress
  namespace: cvgen
spec:
  description: loadtester accepts webhook calls from flagger only
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loadtester
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flagger-system
            k8s:app.kubernetes.io/name: flagger
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# 13. Loadtester targets the gateway pods directly — behind the Gateway
#     listener the client is authorized against the real backend, not the
#     VIP (docs/incidents/0016).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cvgen-loadtester-egress
  namespace: cvgen
spec:
  description: loadtester reaches the gateway pods through the VIP, plus DNS
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loadtester
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app: gateway
        - matchLabels:
            k8s:app: gateway-primary
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
