---
# W10 — L4 NetworkPolicies for the cvgen namespace (vanilla
# networking.k8s.io/v1 only; no CiliumNetworkPolicy resources here).
#
# Model: default-deny first, then explicit allows. Policies are additive in
# Kubernetes — order in this file carries no semantics; the default-deny is
# simply documented first so the file reads top-down as deny, then permit.
#
# Topology per ADR 0012 (infra → db → migrations → apps → canary Flux chain,
# Flagger canaries on Cilium Gateway API). Selector ground truth:
#   - gateway / ai-processor / cv-generator / valkey carry bare `app:` labels
#     authored in deploy/k8s/apps/*.yaml and infra/valkey.yaml.
#   - NATS pods come from the official `nats` Helm chart (HelmRelease in
#     infra/nats.yaml); its selectorLabels helper stamps
#     app.kubernetes.io/name: nats on every pod.
#   - Postgres pods are stamped cnpg.io/cluster: cvgen-db by the CNPG
#     operator (cluster name from deploy/k8s/db/cluster.yaml) — the one
#     label the operator guarantees across versions and role labels.
#   - Migration Job pods are unlabeled in migrations/job.yaml but always
#     receive batch.kubernetes.io/job-name: cvgen-migrate automatically.
#   - Synthetic probe pods get app: cvgen-synthetic from the pod template
#     added in apps/synthetic-cronjob.yaml (per-run job-name labels are not
#     selectable for CronJobs).
#
# Metrics reality (ADR 0010 / docs/k8s/alerting.md): cvgen services PUSH
# OTLP to the fleet collector — nothing scrapes cvgen pods, so there is no
# vmagent→pods ingress rule here (it would be dead config). The single
# 9090 ingress allow below exists for humans/health inspection and any
# future VMPodScrape, not for metrics ingestion.
#
# Host-network envoy nuance: the Cilium Gateway API listeners serving
# :8080 run on the host network, which vanilla NetworkPolicy podSelectors
# cannot select as an ingress source — hence the internet-facing allow has
# NO `from` restriction (scoped to port 8080 only). Future tightening =
# a CiliumNetworkPolicy with fromEntities: [host, world].
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-default-deny-all
  namespace: cvgen
spec:
  # Every pod in cvgen: no ingress, no egress unless another policy allows
  # it. This is the baseline that makes every rule below load-bearing.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-allow-dns-egress
  namespace: cvgen
spec:
  # All cvgen pods must resolve names: gateway resolves S3/OTLP endpoints,
  # ai-processor resolves LLM APIs, the synthetic probe resolves
  # cv.corruptmane.xyz, everything resolves nats.cvgen.svc.
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-allow-gateway-ingress
  namespace: cvgen
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    # Internet-facing :8080 with NO `from` clause (= allow all sources on
    # this port only). WHY: the Cilium Gateway API envoy listeners are
    # HOST-NETWORK pods, unselectable by vanilla NetworkPolicy source
    # selectors — any podSelector/ipBlock "from" here would either block
    # all real traffic or be dead config. Blast radius is contained by the
    # port scope: only the public listener port opens, not ops/9090 or
    # anything else. Future tightening: CiliumNetworkPolicy with
    # fromEntities: [host, world].
    #
    # Flagger's loadtester→gateway traffic during canaries traverses the
    # same host-envoy path (the cilium-gateway Service), so it is covered
    # by this same rule — no separate loadtester allow needed.
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-allow-ops-ingress
  namespace: cvgen
spec:
  # The three services expose healthz/readyz on ops/9090 (kubelet probes
  # are node-to-pod and unaffected by NP ingress rules; this rule is for
  # namespace-scoped inspection).
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - ai-processor
          - cv-generator
  policyTypes:
    - Ingress
  ingress:
    # Scoped to tcp/9090 from the monitoring namespace ONLY. NOT a metrics
    # scrape path: cvgen pushes OTLP to the fleet collector (no /metrics
    # endpoint on these pods; the estate's only scrape target is flagger
    # itself). This covers health/readyz inspection plus any FUTURE
    # VMPodScrape against these ports — if that never lands, the rule is
    # small and honest rather than dead weight.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-gateway-egress
  namespace: cvgen
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Egress
  egress:
    # Postgres job history (cvgen-db-rw backend; operator-guaranteed
    # cluster label, role-agnostic so rw/ro/r backends all match).
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: cvgen-db
      ports:
        - protocol: TCP
          port: 5432
    # API-key provisioning + session store.
    - to:
        - podSelector:
            matchLabels:
              app: valkey
      ports:
        - protocol: TCP
          port: 6379
    # Event bus: publishes cv.job.requested/rendered, consumes all events.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    # Telemetry push (ADR 0010): every span/metric/log record is exported
    # via OTLP to the fleet collector — an in-cluster ClusterIP on tcp/4318.
    # Without this allow, default-deny egress silently drops ALL telemetry,
    # and Flagger's canary gates (which read those series back from
    # VictoriaMetrics) go stale. Namespace+port scope only: deliberately no
    # podSelector, so a helm-chart label change can never turn this into a
    # dead rule and re-break telemetry.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318
    # HTTPS egress for S3 GetObject PDF downloads (verified in
    # services/gateway/internal/s3/s3.go — the gateway streams rendered
    # CVs out of Swift s3api). Not FQDN-restricted: vanilla NetworkPolicy
    # cannot express DNS-name destinations; a CiliumNetworkPolicy with
    # FQDN rules is the documented future option.
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-ai-processor-egress
  namespace: cvgen
spec:
  podSelector:
    matchLabels:
      app: ai-processor
  policyTypes:
    - Egress
  egress:
    # Consumes cv.job.requested, publishes structured events.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    # GETDEL api-key handoff (ADR 0005 exactly-once secret consumption).
    - to:
        - podSelector:
            matchLabels:
              app: valkey
      ports:
        - protocol: TCP
          port: 6379
    # Telemetry push (ADR 0010): see the gateway-egress policy for the full
    # rationale — default-deny would otherwise drop every OTLP record sent
    # to the fleet collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318
    # LLM provider APIs (PydanticAI calls out with user-supplied keys).
    # Cannot be FQDN-restricted under vanilla NetworkPolicy — providers
    # vary per request; CiliumNetworkPolicy FQDN rules = documented future
    # option if the destination set ever stabilizes.
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-cv-generator-egress
  namespace: cvgen
spec:
  podSelector:
    matchLabels:
      app: cv-generator
  policyTypes:
    - Egress
  egress:
    # Consumes structured events, publishes rendered events.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    # Telemetry push (ADR 0010): see the gateway-egress policy for the full
    # rationale — default-deny would otherwise drop every OTLP record sent
    # to the fleet collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318
    # S3 PutObject of rendered PDFs into the cvs bucket.
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-migrations-egress
  namespace: cvgen
spec:
  # migrations/job.yaml authors no pod-template labels, but every Job pod
  # automatically carries batch.kubernetes.io/job-name: <job name> — use
  # that instead of editing the Job for a netpol-only label.
  podSelector:
    matchLabels:
      batch.kubernetes.io/job-name: cvgen-migrate
  policyTypes:
    - Egress
  egress:
    # goose runs SQL migrations against the DSN from secret cvgen-db-app.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: cvgen-db
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-synthetic-egress
  namespace: cvgen
spec:
  # Selects via the app: cvgen-synthetic pod-template label added to
  # apps/synthetic-cronjob.yaml in this workstream: CronJob pods get only
  # per-run job-name labels (cvgen-synthetic-<ts>), which cannot be
  # prefix-matched by vanilla NetworkPolicy selectors.
  podSelector:
    matchLabels:
      app: cvgen-synthetic
  policyTypes:
    - Egress
  egress:
    # Public blackbox probe: BASE_URL is https://cv.corruptmane.xyz, so the
    # pod needs outbound 443 to traverse public DNS → Cloudflare TLS → the
    # host-network envoy listener (re-entering via the gateway-ingress
    # rule above). No other egress: the probe is curl-only by design.
    - ports:
        - protocol: TCP
          port: 443
---
# Incident hotfix (post-deploy): the original set enforced client-side
# EGRESS only. NetworkPolicy needs BOTH directions — without server-side
# ingress allows, default-deny dropped every connection TO valkey, NATS
# and Postgres (migrations hung on TCP connect; gateway-primary went
# unready; canary rolled back), and the CNPG pod itself lost outbound
# access, silently stalling WAL archiving to S3 (archived_count frozen).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-allow-valkey-ingress
  namespace: cvgen
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes:
    - Ingress
  ingress:
    # API-key handoff + session reads/writes from the three app services.
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - gateway
                  - ai-processor
                  - cv-generator
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-allow-nats-ingress
  namespace: cvgen
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    # JetStream publishes/consumes for the whole pipeline.
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - gateway
                  - ai-processor
                  - cv-generator
      ports:
        - protocol: TCP
          port: 4222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-allow-postgres-ingress
  namespace: cvgen
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: cvgen-db
  policyTypes:
    - Ingress
  ingress:
    # Job history writes (gateway) and goose migrations (per-run job pods).
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: cvgen-migrate
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-cnpg-egress
  namespace: cvgen
spec:
  # The instance pod is inside default-deny egress too: barman pushes WALs
  # and base backups to S3 over 443 continuously — losing this freezes the
  # PITR window (observed live: archived_count stuck during the incident).
  podSelector:
    matchLabels:
      cnpg.io/cluster: cvgen-db
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-allow-loadtester-ingress
  namespace: cvgen
spec:
  # Flagger drives canary load by POSTing commands to the loadtester's
  # webhook; without this the NEXT canary analysis fails with no traffic.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loadtester
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flagger-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: flagger
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cvgen-loadtester-egress
  namespace: cvgen
spec:
  # The loadtester's hey clients target the cilium-gateway Service, whose
  # VIP is not pod-selector-matchable; scope to the plain-HTTP port the
  # synthetic load actually uses.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loadtester
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 80
