---
# Golden-signal alerts for cvgen: the four production tripwires that watch
# the gateway between deploys — error rate (two-window pair), tail latency,
# and synthetic-job health. Metrics arrive via OTLP push through the fleet
# otel-collector into VMSingle, which applies Prometheus naming
# server-side (ADR 0010), so the identifiers below are the names PromQL
# actually serves — copied verbatim from canary/metric-templates.yaml and
# the Grafana dashboard; do not "fix" them. Unlike the Flagger canary
# queries, these expressions deliberately cover primary AND canary pods:
# there is no service_instance_id filter here — canary isolation lives in
# canary/metric-templates.yaml, which is the only place that needs it.
# Nothing wires notifications in this repo: the fleet-wide Alertmanager
# catch-all Telegram receiver already routes vmalert alerts (ADR 0015).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cvgen-golden-signals
  namespace: cvgen
spec:
  groups:
    - name: cvgen-golden-signals
      rules:
        # Error-rate pair: a two-window pattern kept at exactly two rules
        # by owner decision — the fast [5m] window trips critical (page),
        # the slow [10m] window warns earlier at a gentler threshold. The
        # 2%/5% thresholds are deliberately looser than Flagger's 99%
        # success-rate CANARY GATE: that gate is a deploy-time control on
        # the traffic shift, not a production alert — once a revision is
        # fully promoted nothing else watches it. Denominators are guarded
        # with clamp_min(.., 1e-12) so a quiet gateway yields ratio 0
        # instead of NaN; an `or vector(0)` fallback on the whole ratio was
        # rejected because it always returns a sample and would fire on
        # empty data.
        - alert: Gateway5xxErrorRateWarning
          expr: |
            (
              sum(rate(http_server_request_duration_seconds_count{service_name="gateway",http_response_status_code=~"5.."}[10m]))
              /
              clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="gateway"}[10m])), 1e-12)
            ) > 0.02
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Gateway 5xx error rate {{ $value | humanizePercentage }} over 10m"
            description: >-
              More than 2% of gateway requests returned 5xx over the last
              10 minutes (currently {{ $value | humanizePercentage }}).
              Covers primary and canary pods; check whether a rollout is in
              progress before treating this as a regression.
            runbook_url: https://github.com/corruptmane/corrupt-cv/blob/main/docs/k8s/alerting.md#gateway-5xx-error-rate
        - alert: Gateway5xxErrorRateCritical
          expr: |
            (
              sum(rate(http_server_request_duration_seconds_count{service_name="gateway",http_response_status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="gateway"}[5m])), 1e-12)
            ) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Gateway 5xx error rate {{ $value | humanizePercentage }} over 5m"
            description: >-
              More than 5% of gateway requests returned 5xx over the last
              5 minutes (currently {{ $value | humanizePercentage }}). This
              is the fast-burn half of the pair: sustained at this level,
              users are visibly failing — investigate immediately.
            runbook_url: https://github.com/corruptmane/corrupt-cv/blob/main/docs/k8s/alerting.md#gateway-5xx-error-rate
        # Latency: p99 over 15m at 1.5s is deliberately LOOSER than the
        # 500ms p99 Flagger enforces during a canary. The gate blocks bad
        # deploys at deploy time; this alert catches sustained degradation
        # of whatever is serving production without paging on canary-shift
        # noise or one-off slow downloads.
        - alert: GatewayLatencyP99High
          expr: |
            histogram_quantile(0.99, sum by (le)(rate(http_server_request_duration_seconds_bucket{service_name="gateway"}[15m]))) > 1.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Gateway p99 latency {{ $value | humanizeDuration }} over 15m"
            description: >-
              The 99th-percentile gateway request duration has exceeded
              1.5s for 15 minutes (currently {{ $value | humanizeDuration }}),
              far past the 500ms the canary gate enforces at deploy time.
              Expect slow page loads and delayed SSE event tails.
            runbook_url: https://github.com/corruptmane/corrupt-cv/blob/main/docs/k8s/alerting.md#gateway-p99-latency
        # LABEL SET STILL TO BE VERIFIED AGAINST LIVE SERIES: this rule was
        # authored ahead of the series it queries. The cvgen-synthetic
        # CronJob now exists (deploy/k8s/apps/synthetic-cronjob.yaml);
        # kube-state-metrics exports kube_job_status_failed for its Jobs
        # once the first scheduled run lands — verify the label set against
        # live data then before fully trusting this rule. Scoping
        # job_name=~"cvgen-synthetic.*" deliberately excludes cvgen-migrate:
        # migration failures gate the apps Kustomization (wait: true) and
        # surface as a Flux reconciliation alert instead (ADR 0015).
        # `for: 5m` is a small anti-flap hold: increase() over 2h already
        # smooths single retries, and the hold rides out a failed Job
        # object being replaced by the next scheduled run.
        - alert: SyntheticJobFailed
          expr: |
            sum(increase(kube_job_status_failed{namespace="cvgen",job_name=~"cvgen-synthetic.*"}[2h])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value | humanize }} failed cvgen-synthetic run(s) in 2h"
            description: >-
              kube-state-metrics reports {{ $value | humanize }} failed
              cvgen-synthetic job run(s) in namespace cvgen over the last
              2 hours. The synthetic probe exercises the full pipeline
              end-to-end, so a failure means the product is broken even
              when user traffic is quiet.
            runbook_url: https://github.com/corruptmane/corrupt-cv/blob/main/docs/k8s/alerting.md#synthetic-job-failures
