# Seed data for the "model-catalog" NATS KV bucket.
#
# The gateway loads this file at boot and upserts every entry into the
# bucket. The UI only offers these keys, and ai-processor rejects any
# key not present in the bucket — raw model ids are never accepted from
# user input. Edit this file and restart the gateway to change the
# catalog.
models:
  - key: fake/canned-cv
    provider: FAKE
    model_id: canned-cv
    display_name: Fake (canned CV)
    description: Returns a fixed example CV without calling any provider. No API key required.
  - key: anthropic/claude-fable-5
    provider: ANTHROPIC
    model_id: claude-fable-5
    display_name: Claude Fable 5
  - key: anthropic/claude-opus-5
    provider: ANTHROPIC
    model_id: claude-opus-5
    display_name: Claude Opus 5
  - key: anthropic/claude-sonnet-5
    provider: ANTHROPIC
    model_id: claude-sonnet-5
    display_name: Claude Sonnet 5
  - key: anthropic/claude-haiku-4-5
    provider: ANTHROPIC
    model_id: claude-haiku-4-5
    display_name: Claude Haiku 4.5
  - key: openai/gpt-5.6-sol
    provider: OPENAI
    model_id: gpt-5.6-sol
    display_name: GPT-5.6 Sol
  - key: openai/gpt-5.6-terra
    provider: OPENAI
    model_id: gpt-5.6-terra
    display_name: GPT-5.6 Terra
  - key: openai/gpt-5.6-luna
    provider: OPENAI
    model_id: gpt-5.6-luna
    display_name: GPT-5.6 Luna
  - key: google/gemini-3.1-pro-preview
    provider: GOOGLE
    model_id: gemini-3.1-pro-preview
    display_name: Gemini 3.1 Pro (Preview)
  - key: google/gemini-3.5-flash
    provider: GOOGLE
    model_id: gemini-3.5-flash
    display_name: Gemini 3.5 Flash
  - key: google/gemini-3.1-flash-lite
    provider: GOOGLE
    model_id: gemini-3.1-flash-lite
    display_name: Gemini 3.1 Flash Lite
  - key: openrouter/glm-5.3
    provider: OPENROUTER
    model_id: z-ai/glm-5.3
    display_name: GLM 5.3 (OpenRouter)
  - key: openrouter/kimi-k3
    provider: OPENROUTER
    model_id: moonshotai/kimi-k3
    display_name: Kimi K3 (OpenRouter)
  - key: openrouter/ox-alpha
